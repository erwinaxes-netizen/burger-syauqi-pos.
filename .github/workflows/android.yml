
name: Build Burger Syauqi APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          mkdir project
          unzip -q *.zip -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name settings.gradle.kts -print -quit)")"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Burger-Syauqi-APK
          path: project/**/build/outputs/apk/debug/*.apk
